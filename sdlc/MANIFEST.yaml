  navigators read context signals and route to Tier-2 posture skills. Each skill
  is a self-contained folder with SKILL.md and references/SOURCES.md. The shared
  PDF evidence library lives in Software_Development_Methodologies_PDFs/.

pdf_library: Software_Development_Methodologies_PDFs/

